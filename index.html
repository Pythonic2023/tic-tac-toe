<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicTacToe</title>
    <script src="scripts/script.js" defer></script>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <h1>Tic Tac Toe</h1>
    <div class="gameboard">
        <div class="row1 cella a1">a</div>
        <div class="row1 cellb b1">b</div>
        <div class="row1 cellc c1">c</div>
        <div class="row2 cella a2">a</div>
        <div class="row2 cellb b2">b</div>
        <div class="row2 cellc c2">c</div>
        <div class="row3 cella a3">a</div>
        <div class="row3 cellb b3">b</div>
        <div class="row3 cellc c3">c</div>
    </div>
</body>
</html>
